# The release gate, on every push and pull request.
#
# `python -m backend.check` is the same command used locally: unit tests, the offline
# benchmark at a 100% pass rate, and the rules-library check. It needs no model and no
# network — the benchmark is scripted and the tests stub the LLM — so it runs in about a
# minute on a hosted runner.
name: release gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest interpreter TORA is run on in practice (it is what
        # ships in the dev VM). Keep it in the matrix: an SSRF-guard bug that
        # only appeared below 3.11.10 reached a developer machine because CI
        # tested 3.11/3.12 only.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        if: matrix.python-version == '3.12'
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Release gate
        env:
          # The gate must never reach a model or the network: if a test tries, it fails
          # loudly here rather than passing locally and failing for someone else.
          TORA_AUTH_MODE: "off"
          OLLAMA_HOST: "http://127.0.0.1:1"
        run: python -m backend.check

      - name: Frontend tests
        # The chat UI is three files that live inside Spendsy, so until this repo had its own
        # package they could only be run from a Spendsy checkout — which meant never, here.
        if: matrix.python-version == '3.12'
        working-directory: frontend
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm test

      - name: Status doc still describes the code
        # The doc is generated, so it can go stale silently. --check ignores the generation
        # date and fails on anything else that has drifted.
        if: matrix.python-version == '3.12'
        run: python -m backend.status --check
